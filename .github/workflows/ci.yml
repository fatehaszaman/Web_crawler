name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    name: Compile Java tools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile Java files
        run: |
          javac WebCrawler.java
          javac URLScraper.java
          javac UniqueLinks.java
          javac PrintLinksInAlphabeticalOrder.java
          javac NYTimesURLGenerator.java
